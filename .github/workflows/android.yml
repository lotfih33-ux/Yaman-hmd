
name: Build Yaman HMD APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add native printing
        run: |
          mkdir -p android/app/src/main/java/com/yaman/hmd
          cat > android/app/src/main/java/com/yaman/hmd/NativePrintPlugin.java <<'EOF'
          package com.yaman.hmd;

          import android.content.Context;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {
              @PluginMethod
              public void printHtml(PluginCall call) {
                  String html = call.getString("html");
                  if (html == null || html.isEmpty()) {
                      call.reject("No invoice content");
                      return;
                  }

                  getActivity().runOnUiThread(() -> {
                      try {
                          WebView webView = new WebView(getContext());
                          webView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  PrintManager manager = (PrintManager)
                                      getContext().getSystemService(Context.PRINT_SERVICE);
                                  manager.print(
                                      "Yaman-HMD-Facture",
                                      view.createPrintDocumentAdapter("Facture"),
                                      null
                                  );
                                  call.resolve();
                              }
                          });
                          webView.loadDataWithBaseURL(
                              "https://localhost/", html, "text/html", "UTF-8", null
                          );
                      } catch (Exception e) {
                          call.reject("Print error: " + e.getMessage());
                      }
                  });
              }
          }
          EOF

          cat > android/app/src/main/java/com/yaman/hmd/MainActivity.java <<'EOF'
          package com.yaman.hmd;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Patch invoice printing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          script = r'''
          <script>
          (function () {
            var oldPrint = window.printInvoiceNow;
            window.printInvoiceNow = function () {
              var invoice = document.getElementById('invoice-render');
              if (!invoice) {
                alert('لم يتم العثور على الفاتورة');
                return;
              }
              var styles = Array.from(document.querySelectorAll('style, link[rel="stylesheet"]'))
                .map(function (x) { return x.outerHTML; }).join('\n');
              var html = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
                styles +
                '<style>@page{size:A4;margin:10mm}body{background:white!important;margin:0}' +
                '#invoice-render{display:block!important;visibility:visible!important}' +
                '</style></head><body>' + invoice.outerHTML + '</body></html>';
              var plugin = window.Capacitor && window.Capacitor.Plugins &&
                window.Capacitor.Plugins.NativePrint;
              if (plugin && plugin.printHtml) {
                plugin.printHtml({html: html}).catch(function (e) {
                  alert('تعذرت الطباعة: ' + e);
                });
              } else if (oldPrint) {
                oldPrint();
              } else {
                alert('ميزة الطباعة غير متاحة');
              }
            };
          })();
          </script>
          '''
          if 'YAMAN_NATIVE_PRINT_PATCH' not in s:
              script = script.replace('<script>', '<script>/* YAMAN_NATIVE_PRINT_PATCH */', 1)
              s = s.replace('</body>', script + '\n</body>')
              p.write_text(s, encoding="utf-8")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaman-HMD-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
